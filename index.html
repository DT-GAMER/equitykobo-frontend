<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EquityKobo helps long-term investors find Nigerian companies worth researching before they invest."
    />

    <!-- Favicons, generated from the logo mark into public/. Each tile is the
         mark centred on white: the mark's navy bar all but disappears on a dark
         browser tab, so a transparent background would lose a third of it. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d1f3a" />

    <!-- iOS ignores the manifest's install prompt entirely — Safari has no
         equivalent of beforeinstallprompt, so users must use Share > Add to
         Home Screen. These tags control what happens once they do: open in a
         standalone window rather than a Safari tab, and label the icon
         "EquityKobo" instead of the full <title>. iOS 15.4+ reads `display`
         from the manifest, but older versions only honour the Apple tag. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EquityKobo" />

    <title>EquityKobo | Nigerian Equity Research Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
